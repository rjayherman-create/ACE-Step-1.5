<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galei Ivrit Jr Song Factory</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:32px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001;margin-bottom:18px}label{display:block;font-weight:700;margin:14px 0 6px}textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #ccd4e0;border-radius:10px;padding:11px;font-size:16px}textarea{min-height:130px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#1f6feb;color:#fff;margin:8px 8px 0 0}button:disabled{opacity:.45}.secondary{background:#e9eef6;color:#1b2738}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.ok{color:#16803c}.bad{color:#b42318}.warn{color:#9a6700}.progress{display:none;margin-top:14px}.bar{height:14px;border-radius:99px;background:#dfe6ef;overflow:hidden}.bar span{display:block;height:100%;width:5%;background:#1f6feb}.state{font-size:20px;font-weight:800;margin-top:10px}.result{padding:14px;border-radius:10px;background:#f0f4f9;margin-top:12px;white-space:pre-wrap}.failure{background:#fff0f0;color:#8a1c1c}.success{background:#edf9f0;color:#166534}.player{padding:14px;border:1px solid #dce3ec;border-radius:12px;margin-top:12px}audio{width:100%;margin-top:8px}.small{font-size:13px;color:#607086}</style></head><body><div class="wrap"><div class="card"><h1>Galei Ivrit Jr Song Factory</h1><div class="small">GTX 1650 safe mode: 30-second quick test, one song, no LM, reduced inference steps.</div><p id="health">Checking ACE-Step…</p></div><div class="card"><label>Module</label><select id="module"><option value="home">At Home</option><option value="animals">Animal Friends</option><option value="school">My Classroom</option><option value="colors">Colors Everywhere</option></select><div class="grid"><div><label>Length</label><input id="duration" type="number" value="30" min="20" max="45"></div><div><label>Variations</label><select id="variations"><option selected>1</option></select></div></div><label>Hebrew lyrics</label><textarea id="lyrics"></textarea><label>Music style</label><textarea id="style"></textarea><button id="generate">Generate quick test</button><button id="check" class="secondary" disabled>Check now</button><div id="progress" class="progress"><div class="bar"><span id="bar"></span></div><div id="state" class="state">Preparing…</div><div id="detail" class="small"></div></div><div id="result" class="result">Ready.</div><div id="players"></div></div></div><script>const $=id=>document.getElementById(id);const presets={home:{lyrics:'[Verse]\nבבית שלי, בבית שלי\nיש בית, דלת וספר בשבילי\nבית, דלת, ספר — בואו נגיד\nעברית ביחד, שוב ושוב תמיד\n\n[Chorus]\nבית, דלת, ספר\nאני שומע ואני זוכר',style:"warm upbeat children's educational pop, acoustic guitar, hand percussion, light piano, friendly youthful lead vocal, clear Hebrew diction, catchy chorus, polished studio production"},animals:{lyrics:'[Verse]\nכלב רץ, חתול קופץ\nדג קטן במים שוחה\nכלב, חתול, דג ביחד\nלומדים עברית בשמחה\n\n[Chorus]\nכלב, חתול, דג\nשומעים, אומרים, עוד פעם עכשיו',style:"bright playful children's pop, natural drums, bass, acoustic guitar, claps, cheerful lead vocal, crisp Hebrew pronunciation"},school:{lyrics:'[Verse]\nילד בכיתה, ילדה בכיתה\nהמורה אומרת בוקר טוב\nילד, ילדה, מורה ביחד\nלומדים מילים ונזכור אותן טוב',style:"energetic school-day children's pop, piano, guitar, bass, natural drums, hand claps, friendly lead vocal, clear Hebrew diction"},colors:{lyrics:'[Verse]\nכחול בשמים, אדום בפרח\nירוק בעץ שגדל בגינה\nכחול, אדום, ירוק סביבנו\nכל העולם מלא צבעים בשמחה',style:"colorful upbeat children's pop, ukulele, piano, bass, live-feel percussion, bright friendly vocal, clear Hebrew pronunciation"}};function load(){const p=presets[$('module').value];$('lyrics').value=p.lyrics;$('style').value=p.style}$('module').onchange=load;load();let task='',timer=null,started=0,lastSignature='',lastChange=0;function show(title,detail,pct,cls=''){ $('progress').style.display='block';$('state').textContent=title;$('detail').textContent=detail;$('bar').style.width=Math.max(5,Math.min(100,pct))+'%';$('result').className='result '+cls}async function health(){try{const x=await fetch('/api/status').then(r=>r.json());$('health').textContent=x.ace?'ACE-Step is ready':'ACE-Step is not ready';$('health').className=x.ace?'ok':'bad';$('generate').disabled=!x.ace;return !!x.ace}catch{$('health').textContent='Cannot reach local song service';$('health').className='bad';$('generate').disabled=true;return false}}health();setInterval(health,10000);function rowsFrom(x){const d=Array.isArray(x.data)?x.data:[x.data].filter(Boolean),rows=[];for(const t of d){let r=t&&t.result;if(typeof r==='string'){try{r=JSON.parse(r)}catch{}}if(Array.isArray(r))r.forEach(z=>rows.push({...z,_task:t}));else if(r)rows.push({...r,_task:t});else rows.push({_task:t})}return rows}async function poll(){if(!task)return;try{const x=await fetch('/api/result?task_id='+encodeURIComponent(task)).then(r=>r.json());const rows=rowsFrom(x),top=rows[0]||{},outer=top._task||{},status=outer.status??top.status??0,elapsed=Math.round((Date.now()-started)/1000);const sig=JSON.stringify([status,top.stage,top.progress,outer.progress_text]);if(sig!==lastSignature){lastSignature=sig;lastChange=Date.now()}const unchanged=(Date.now()-lastChange)/1000;if(status===2||top.stage==='failed'){clearInterval(timer);timer=null;$('generate').disabled=false;show('Generation failed','ACE-Step stopped the task.',100,'failure');$('result').textContent='FAILED — no song was created.\n'+(outer.progress_text||top.stage||'Unknown ACE error');return}if(status===1){clearInterval(timer);timer=null;$('generate').disabled=false;show('Finished!','Your song is ready.',100,'success');$('result').textContent='SONG READY';render(rows);return}if(unchanged>=300){clearInterval(timer);timer=null;$('generate').disabled=false;show('STALLED','ACE-Step has reported no real status change for 5 minutes. Stop this run and restart the Song Factory.',100,'failure');$('result').textContent='STALLED — the task is responding, but its actual ACE status has not changed for 5 minutes.\nTask: '+task;return}const pct=Math.min(85,10+elapsed/8);show('Generating quick test…',elapsed+' seconds elapsed. Last real ACE change '+Math.round(unchanged)+' seconds ago.',pct);$('result').textContent='Working. This bar is only a timer; completion comes from ACE-Step itself.'}catch(e){$('result').textContent='Status check error: '+e.message}}function render(items){$('players').innerHTML='';let n=0;for(const it of items){const p=it.audio_path||it.path||it.audio_url||it.url||it.file;if(!p)continue;n++;const d=document.createElement('div');d.className='player';d.innerHTML='<b>Song '+n+'</b><audio controls src="/api/audio?path='+encodeURIComponent(p)+'"></audio>';$('players').appendChild(d)}}$('generate').onclick=async()=>{if(!(await health()))return;$('players').innerHTML='';$('generate').disabled=true;show('Starting…','Submitting 30-second GTX 1650 quick test.',5);try{const x=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lyrics:$('lyrics').value,style:$('style').value,duration:+$('duration').value,variations:1})}).then(r=>r.json());task=(x.data&&x.data.task_id)||x.task_id||'';if(!task)throw new Error(x.error||'No task ID');started=Date.now();lastChange=Date.now();lastSignature='';$('check').disabled=false;timer=setInterval(poll,5000);poll()}catch(e){$('generate').disabled=false;show('Could not start',String(e.message||e),100,'failure')}};$('check').onclick=poll;</script></body></html>
