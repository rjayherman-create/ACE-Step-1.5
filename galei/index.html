<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galei Ivrit Jr Song Factory</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:32px auto;padding:0 18px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001;margin-bottom:18px}h1{margin:0 0 6px}.status{font-weight:700}.ok{color:#16803c}.bad{color:#b42318}label{display:block;font-weight:700;margin:14px 0 6px}textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #ccd4e0;border-radius:10px;padding:11px;font-size:16px}textarea{min-height:130px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#1f6feb;color:#fff;margin:8px 8px 0 0}button.secondary{background:#e9eef6;color:#1b2738}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}audio{width:100%;margin-top:12px}.small{font-size:13px;color:#607086}.result{padding:12px;border-radius:10px;background:#f0f4f9;margin-top:12px;white-space:pre-wrap}</style></head><body><div class="wrap"><div class="card"><h1>Galei Ivrit Jr Song Factory</h1><div class="small">Local full-audio Hebrew song generation using ACE-Step 1.5 — not MIDI.</div><p id="status" class="status">Checking ACE-Step…</p></div><div class="card"><label>Module</label><select id="module"><option value="home">At Home</option><option value="animals">Animal Friends</option><option value="school">My Classroom</option><option value="colors">Colors Everywhere</option><option value="custom">Custom</option></select><div class="grid"><div><label>Length (seconds)</label><input id="duration" type="number" value="75" min="20" max="180"></div><div><label>Variations</label><select id="variations"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div></div><label>Hebrew lyrics</label><textarea id="lyrics"></textarea><label>Music style</label><textarea id="style"></textarea><button id="generate">Generate songs</button><button id="check" class="secondary">Check result</button><div id="result" class="result">Ready.</div><div id="players"></div></div></div><script>const presets={home:{lyrics:'[Verse]\nבבית שלי, בבית שלי\nיש בית, דלת וספר בשבילי\nבית, דלת, ספר — בואו נגיד\nעברית ביחד, שוב ושוב תמיד\n\n[Chorus]\nבית, דלת, ספר\nאני שומע ואני זוכר\nבית, דלת, ספר\nעברית זה כיף, אני כבר מדבר',style:"warm upbeat children's educational pop, acoustic guitar, hand percussion, light piano, friendly youthful lead vocal, clear Hebrew diction, catchy chorus, polished studio production, no artist imitation"},animals:{lyrics:'[Verse]\nכלב רץ, חתול קופץ\nדג קטן במים שוחה\nכלב, חתול, דג ביחד\nלומדים עברית בשמחה\n\n[Chorus]\nכלב, חתול, דג\nשומעים, אומרים, עוד פעם עכשיו\nכלב, חתול, דג\nשרים בעברית וזה כל כך כיף',style:"bright playful children's pop, real-sounding drums, bass, acoustic guitar, claps, cheerful lead vocal, crisp Hebrew pronunciation, polished full-band production, no artist imitation"},school:{lyrics:'[Verse]\nילד בכיתה, ילדה בכיתה\nהמורה אומרת בוקר טוב\nילד, ילדה, מורה ביחד\nלומדים מילים ונזכור אותן טוב\n\n[Chorus]\nילד, ילדה, מורה\nשומעים עברית בכל השורה\nילד, ילדה, מורה\nשרים ולומדים בשמחה',style:"energetic school-day children's pop, piano, guitar, bass, natural drums, hand claps, friendly lead vocal, very clear Hebrew diction, polished studio mix, no artist imitation"},colors:{lyrics:'[Verse]\nכחול בשמים, אדום בפרח\nירוק בעץ שגדל בגינה\nכחול, אדום, ירוק סביבנו\nכל העולם מלא צבעים בשמחה\n\n[Chorus]\nכחול, אדום, ירוק\nאומרים את הצבע ולא מפסיקים לצחוק\nכחול, אדום, ירוק\nשרים בעברית וזוכרים מרחוק',style:"colorful upbeat children's pop, ukulele, piano, bass, live-feel percussion, bright friendly vocal, clear Hebrew pronunciation, catchy educational chorus, polished studio production, no artist imitation"}};let task='';const $=id=>document.getElementById(id);function load(){const p=presets[$('module').value];if(p){$('lyrics').value=p.lyrics;$('style').value=p.style}}$('module').onchange=load;load();fetch('/api/status').then(r=>r.json()).then(x=>{const ok=!!x.ace;$('status').textContent=ok?'ACE-Step is ready':'ACE-Step API is not ready yet';$('status').className='status '+(ok?'ok':'bad')});$('generate').onclick=async()=>{ $('result').textContent='Submitting generation…';const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({moduleId:$('module').value,lyrics:$('lyrics').value,style:$('style').value,duration:+$('duration').value,variations:+$('variations').value,thinking:true})});const x=await r.json();task=(x.data&&x.data.task_id)||x.task_id||'';$('result').textContent=task?'Task started: '+task+'\nUse Check result after generation completes.':JSON.stringify(x,null,2)};$('check').onclick=async()=>{if(!task){$('result').textContent='Generate a song first.';return}const r=await fetch('/api/result?task_id='+encodeURIComponent(task));const x=await r.json();$('result').textContent=JSON.stringify(x,null,2);const d=x.data||[];const arr=Array.isArray(d)?d:[d];let items=[];for(const t of arr){let z=t&&t.result;if(typeof z==='string'){try{z=JSON.parse(z)}catch{}}if(Array.isArray(z))items.push(...z)}$('players').innerHTML='';items.forEach((it,i)=>{const p=it.audio_path||it.path||it.audio_url||it.url;if(!p)return;const box=document.createElement('div');box.innerHTML='<b>Variation '+(i+1)+'</b><audio controls src="/api/audio?path='+encodeURIComponent(p)+'"></audio><button>Save as module song</button>';box.querySelector('button').onclick=async()=>{const rr=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p,moduleId:$('module').value,lyrics:$('lyrics').value,style:$('style').value})});alert(JSON.stringify(await rr.json()))};$('players').appendChild(box)})};</script></body></html>
