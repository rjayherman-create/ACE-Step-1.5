<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galei Ivrit Jr Song Factory</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:32px auto;padding:0 18px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001;margin-bottom:18px}h1{margin:0 0 6px}.status{font-weight:700}.ok{color:#16803c}.bad{color:#b42318}.working{color:#9a6700}label{display:block;font-weight:700;margin:14px 0 6px}textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #ccd4e0;border-radius:10px;padding:11px;font-size:16px}textarea{min-height:130px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#1f6feb;color:#fff;margin:8px 8px 0 0}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e9eef6;color:#1b2738}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}audio{width:100%;margin-top:12px}.small{font-size:13px;color:#607086}.result{padding:14px;border-radius:10px;background:#f0f4f9;margin-top:12px}.progressWrap{display:none;margin-top:14px}.progressBar{height:14px;border-radius:99px;background:#dfe6ef;overflow:hidden}.progressBar span{display:block;height:100%;width:6%;background:#1f6feb;transition:width .4s}.state{font-size:18px;font-weight:800;margin:10px 0 4px}.detail{font-size:14px;color:#607086}.failure{background:#fff0f0;border:1px solid #f0b4b4;color:#8a1c1c}.success{background:#edf9f0;border:1px solid #a8ddb5;color:#166534}.playerCard{margin-top:14px;padding:14px;border:1px solid #dce3ec;border-radius:12px}</style></head><body><div class="wrap"><div class="card"><h1>Galei Ivrit Jr Song Factory</h1><div class="small">Local full-audio Hebrew song generation using ACE-Step 1.5 — not MIDI.</div><p id="status" class="status">Checking ACE-Step…</p></div><div class="card"><label>Module</label><select id="module"><option value="home">At Home</option><option value="animals">Animal Friends</option><option value="school">My Classroom</option><option value="colors">Colors Everywhere</option><option value="custom">Custom</option></select><div class="grid"><div><label>Length (seconds)</label><input id="duration" type="number" value="75" min="20" max="180"></div><div><label>Variations</label><select id="variations"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div></div><label>Hebrew lyrics</label><textarea id="lyrics"></textarea><label>Music style</label><textarea id="style"></textarea><button id="generate">Generate songs</button><button id="check" class="secondary" disabled>Check now</button><div id="progress" class="progressWrap"><div class="progressBar"><span id="bar"></span></div><div id="state" class="state">Preparing…</div><div id="detail" class="detail">Waiting for ACE-Step.</div></div><div id="result" class="result">Ready.</div><div id="players"></div></div></div><script>const presets={home:{lyrics:'[Verse]\nבבית שלי, בבית שלי\nיש בית, דלת וספר בשבילי\nבית, דלת, ספר — בואו נגיד\nעברית ביחד, שוב ושוב תמיד\n\n[Chorus]\nבית, דלת, ספר\nאני שומע ואני זוכר\nבית, דלת, ספר\nעברית זה כיף, אני כבר מדבר',style:"warm upbeat children's educational pop, acoustic guitar, hand percussion, light piano, friendly youthful lead vocal, clear Hebrew diction, catchy chorus, polished studio production, no artist imitation"},animals:{lyrics:'[Verse]\nכלב רץ, חתול קופץ\nדג קטן במים שוחה\nכלב, חתול, דג ביחד\nלומדים עברית בשמחה\n\n[Chorus]\nכלב, חתול, דג\nשומעים, אומרים, עוד פעם עכשיו\nכלב, חתול, דג\nשרים בעברית וזה כל כך כיף',style:"bright playful children's pop, real-sounding drums, bass, acoustic guitar, claps, cheerful lead vocal, crisp Hebrew pronunciation, polished full-band production, no artist imitation"},school:{lyrics:'[Verse]\nילד בכיתה, ילדה בכיתה\nהמורה אומרת בוקר טוב\nילד, ילדה, מורה ביחד\nלומדים מילים ונזכור אותן טוב\n\n[Chorus]\nילד, ילדה, מורה\nשומעים עברית בכל השורה\nילד, ילדה, מורה\nשרים ולומדים בשמחה',style:"energetic school-day children's pop, piano, guitar, bass, natural drums, hand claps, friendly lead vocal, very clear Hebrew diction, polished studio mix, no artist imitation"},colors:{lyrics:'[Verse]\nכחול בשמים, אדום בפרח\nירוק בעץ שגדל בגינה\nכחול, אדום, ירוק סביבנו\nכל העולם מלא צבעים בשמחה\n\n[Chorus]\nכחול, אדום, ירוק\nאומרים את הצבע ולא מפסיקים לצחוק\nכחול, אדום, ירוק\nשרים בעברית וזוכרים מרחוק',style:"colorful upbeat children's pop, ukulele, piano, bass, live-feel percussion, bright friendly vocal, clear Hebrew pronunciation, catchy educational chorus, polished studio production, no artist imitation"}};let task='',timer=null,started=0;const $=id=>document.getElementById(id);function load(){const p=presets[$('module').value];if(p){$('lyrics').value=p.lyrics;$('style').value=p.style}}$('module').onchange=load;load();function setProgress(title,detail,pct,kind=''){ $('progress').style.display='block';$('state').textContent=title;$('detail').textContent=detail;$('bar').style.width=Math.max(5,Math.min(100,pct))+'%';$('result').className='result '+kind }async function health(){try{const x=await fetch('/api/status').then(r=>r.json());const ok=!!x.ace;$('status').textContent=ok?'ACE-Step is ready':'ACE-Step API is not ready yet';$('status').className='status '+(ok?'ok':'bad');$('generate').disabled=!ok;return ok}catch{$('status').textContent='Cannot reach local song service';$('status').className='status bad';$('generate').disabled=true;return false}}health();setInterval(health,10000);function extract(x){const d=Array.isArray(x.data)?x.data:[x.data].filter(Boolean);const rows=[];for(const t of d){let r=t&&t.result;if(typeof r==='string'){try{r=JSON.parse(r)}catch{}}if(Array.isArray(r))for(const z of r)rows.push({...z,_task:t});else if(r)rows.push({...r,_task:t});else rows.push({_task:t})}return rows}async function poll(manual=false){if(!task)return;try{const x=await fetch('/api/result?task_id='+encodeURIComponent(task)).then(r=>r.json());const rows=extract(x);const top=rows[0]||{};const outer=top._task||{};const status=outer.status??top.status??0;const elapsed=Math.max(1,Math.round((Date.now()-started)/1000));if(status===2||top.stage==='failed'){clearInterval(timer);timer=null;$('generate').disabled=false;$('check').disabled=false;setProgress('Generation failed','ACE-Step stopped this song after '+elapsed+' seconds. The task did not produce audio. Check the ACE-Step black window for the exact model/GPU error.',100,'failure');$('result').textContent='FAILED — no song was created.\nTask: '+task+'\nLast ACE message: '+(outer.progress_text||top.stage||'Generation failed');return}if(status===1){clearInterval(timer);timer=null;setProgress('Finished!','Your song is ready to play below.',100,'success');$('result').textContent='SONG READY — choose a variation below.';$('generate').disabled=false;$('check').disabled=false;render(rows);return}let pct=Number(top.progress||0);if(pct>0&&pct<=1)pct*=100;if(!pct)pct=Math.min(90,10+elapsed/3);setProgress('Generating your song…','ACE-Step is working. '+elapsed+' seconds elapsed. You do not need to press anything.',pct,'');$('result').textContent='Please leave this page open. I will tell you automatically when the song is finished.'}catch(e){if(manual)$('result').textContent='Could not check the task: '+e.message}}function render(items){$('players').innerHTML='';let n=0;for(const it of items){const p=it.audio_path||it.path||it.audio_url||it.url||it.file;if(!p)continue;n++;const box=document.createElement('div');box.className='playerCard';box.innerHTML='<b>Variation '+n+'</b><audio controls src="/api/audio?path='+encodeURIComponent(p)+'"></audio><button>Save as module song</button>';box.querySelector('button').onclick=async()=>{const rr=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p,moduleId:$('module').value,lyrics:$('lyrics').value,style:$('style').value})});const z=await rr.json();$('result').textContent=z.ok?'Saved: '+z.file:'Save failed: '+JSON.stringify(z)};$('players').appendChild(box)}if(!n)$('result').textContent+='\nACE-Step reported completion but no playable audio path was returned.'}$('generate').onclick=async()=>{if(!(await health()))return;$('players').innerHTML='';$('generate').disabled=true;$('check').disabled=true;setProgress('Starting…','Sending your lyrics and music instructions to ACE-Step.',5);$('result').textContent='Starting generation…';try{const x=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({moduleId:$('module').value,lyrics:$('lyrics').value,style:$('style').value,duration:+$('duration').value,variations:+$('variations').value,thinking:true})}).then(r=>r.json());task=(x.data&&x.data.task_id)||x.task_id||'';if(!task)throw new Error(x.error||'ACE-Step did not return a task ID');started=Date.now();$('check').disabled=false;setProgress('Generating your song…','Task started. I will check automatically every 5 seconds.',8);if(timer)clearInterval(timer);timer=setInterval(()=>poll(false),5000);poll(false)}catch(e){$('generate').disabled=false;setProgress('Could not start','The generation request failed before ACE-Step accepted it.',100,'failure');$('result').textContent=String(e.message||e)}};$('check').onclick=()=>poll(true);</script></body></html>
